# Nginx 站点配置 —— 人工智能应用赛项 · 市级初赛平台
# 安装：sudo cp deploy/nginx-contest.conf /etc/nginx/sites-available/contest
#       sudo ln -s /etc/nginx/sites-available/contest /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

# 限速区：登录接口按 IP 限速，防爆破
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
# 通用 API 限速
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    # 改为你的域名或服务器 IP
    server_name _;

    # 请求体上限（CSV 名单批量导入余量）
    client_max_body_size 10m;

    # gzip 压缩：API 与静态资源
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 静态资源（前端 SPA，直接由 Nginx 服务，长缓存）
    location /static/ {
        alias /opt/contest/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # 登录接口限速（防口令爆破）
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_contest.conf;
    }

    # API 反向代理
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_contest.conf;
    }

    # 其余路径 → 前端 SPA（由后端兜底返回 index.html，也可改为 nginx try_files）
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_contest.conf;
    }

    access_log /var/log/nginx/contest.access.log;
    error_log  /var/log/nginx/contest.error.log warn;
}
